{% extends "base.html" %}

{% block content %}
<h2>Se connecter</h2>
<form method="post">
    <p>
        <label>Pseudo</label>
        <input type="text" name="username" required>
    </p>
    <p>
        <label>Mot de passe</label>
        <input type="password" name="password" required>
    </p>
    <p>
        <button type="submit">Se connecter</button>
    </p>
</form>
<p>Pas encore de compte ? <a href="/register">S'inscrire</a></p>
{% endblock %}
